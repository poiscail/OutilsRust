[package]
name = "outils"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Outils"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
