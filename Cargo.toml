[package]
name = "outils"
version = "0.7.0"
edition = "2021"

[[bin]]
name = "Outils"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.2"
flate2 = "1"
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "ico", "tiff"] }
native-tls = "0.2"
nnnoiseless = { version = "0.5", default-features = false }
kamadak-exif = "0.6"
lopdf = "0.36"
qrcode = { version = "0.14", default-features = false }
regex = "1"
rfd = "0.15"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256", "ppmd", "util", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Graphics_Dwm", "Win32_System_Shutdown", "Win32_Devices_Display", "Win32_System_IO", "Win32_UI_Input", "Win32_UI_Input_XboxController", "Win32_Media_Audio"] }

# Argon2 sans optimisation = tests très lents
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
strip = true
