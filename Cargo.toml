[package]
name = "outils"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Outils"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.2"
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Argon2 sans optimisation = tests très lents
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
strip = true
