[package]
name = "outils-mobile"
version = "0.2.0"
edition = "2021"
description = "Outils sur téléphone Android : jeux et outils du quotidien, partagés avec la version PC"

# crate à part (pas dans l'espace de travail du programme PC)
[workspace]

[lib]
name = "outils_mobile"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
egui_extras = { version = "0.31", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2"
getrandom = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
log = "0.4"
# les dialogues de fichiers n'existent pas sur téléphone : version vide
rfd = { path = "shims/rfd" }

sha1_smol = "1"
rqrr = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"
ndk-context = "0.1"
ndk = { version = "0.9", features = ["audio", "api-level-26"] }
ndk-sys = { version = "0.6", features = ["media"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.android]
package = "fr.poiscail.outils"
apk_name = "Outils"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Outils"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
orientation = "unspecified"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

# pour essayer l'appli sur PC Linux (cargo run --example bureau)
[target.'cfg(all(not(target_os = "android"), target_os = "linux"))'.dev-dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(windows)'.dev-dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACTIVITY_RECOGNITION"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.QUERY_ALL_PACKAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_DELETE_PACKAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_FINE_LOCATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_COARSE_LOCATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.sensor.stepcounter"
required = false
